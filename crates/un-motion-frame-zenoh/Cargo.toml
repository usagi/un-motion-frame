[package]
name = "un-motion-frame-zenoh"
version = "0.1.0"
edition.workspace = true
license.workspace = true
authors.workspace = true
repository.workspace = true
description = "Official Zenoh Pub/Sub wire format and utilities for UNMotionFrame (payload schema lives in `un-motion-frame`)."
readme = "../../README.md"
keywords = ["motion-capture", "mocap", "zenoh", "pubsub"]
categories = ["network-programming", "multimedia"]

[lib]
name = "un_motion_frame_zenoh"
path = "src/lib.rs"

[features]
default = ["zenoh-transport"]
zenoh-transport = ["dep:zenoh"]

[dependencies]
un-motion-frame = { workspace = true, features = ["serde"] }
serde = { workspace = true }
rmp-serde = { workspace = true }
anyhow = { workspace = true }
thiserror = { workspace = true }
crossbeam-channel = { workspace = true }
tracing = { workspace = true }
zenoh = { version = "1.9", default-features = false, features = ["transport_tcp", "transport_udp"], optional = true }

[dev-dependencies]
serde_json = { workspace = true }

[lints]
workspace = true
